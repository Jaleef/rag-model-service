[project]
name = "rag-model-service"
version = "0.1.0"
description = "CPU-friendly FastAPI service for Qwen3 embeddings and reranking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "huggingface-hub>=2.4.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.16.3",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

# 关键修改：告诉 uv_build 使用扁平布局，模块名为 app
[tool.uv.build-backend]
module-root = ""       # 关闭默认的 src 前缀，从项目根目录找
module-name = "app"    # 你的模块目录名是 app

[project.scripts]
rag-model-service = "app.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
