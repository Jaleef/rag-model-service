services:
  rag-model-service:
    build: .
    container_name: rag-model-service
    init: true

    ports:
      - "8000:8000"

    volumes:
      - ./models:/models:ro

    environment:
      MODEL_DIR: /models
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"

    restart: unless-stopped
    stop_grace_period: 30s
